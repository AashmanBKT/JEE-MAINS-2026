<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Mains Mock Test 2026</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h1 { color: #333; }
        select, button { width: 100%; padding: 10px; margin-top: 15px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>JEE Mains Mock Test</h1>
        <p>Select a Jan 2026 Shift Paper to attempt:</p>
        <form action="#" id="shiftForm">
            <select id="shiftSelect" required>
                <option value="" disabled selected>Select a paper...</option>
                {% for shift in shifts %}
                <option value="{{ shift }}">{{ shift }}</option>
                {% endfor %}
            </select>
            <button type="submit">Start Test</button>
        </form>
    </div>
    
    <script>
        document.getElementById('shiftForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const shift = document.getElementById('shiftSelect').value;
            if (shift) {
                window.location.href = '/test/' + encodeURIComponent(shift);
            }
        });
    </script>
</body>
</html>
