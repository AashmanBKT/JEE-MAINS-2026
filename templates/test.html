<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ shift }} - JEE Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #fff; }
        
        .header { background: #007bff; color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
        .header-title { font-size: 24px; font-weight: bold; display: flex; align-items: center; }
        .candidate-info { background: white; color: black; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .timer { font-weight: bold; color: #d9534f; font-size: 18px; }
        
        .main-body { display: flex; flex-grow: 1; overflow: hidden; }
        
        .left-panel { width: 70%; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
        .tabs { display: flex; background: #f0ad4e; padding: 10px 20px 0; gap: 5px; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: #e69b35; color: white; font-size: 16px; font-weight: bold; border-radius: 4px 4px 0 0; }
        .tab.active { background: #fff; color: #333; }
        
        .pdf-view { flex-grow: 1; display: none; width: 100%; height: 100%; border: none; }
        .pdf-view.active { display: block; }
        
        .right-panel { width: 30%; display: flex; flex-direction: column; background: #f9f9f9; }
        .omr-header { padding: 15px; background: #337ab7; color: white; text-align: center; font-size: 20px; font-weight: bold; }
        .omr-content { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .subject-omr { display: none; }
        .subject-omr.active { display: block; }
        
        .q-row { display: flex; align-items: center; margin-bottom: 10px; padding: 8px; border-radius: 4px; transition: background 0.2s; cursor: pointer; border: 1px solid transparent; }
        .q-row:hover { background: #eef3f6; border-color: #bce8f1; }
        
        .q-num { width: 50px; font-weight: bold; color: #337ab7; }
        .q-options label { margin-right: 10px; cursor: pointer; }
        .num-input { width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 3px; }
        .section-title { font-size: 18px; margin: 20px 0 10px; border-bottom: 2px solid #ddd; padding-bottom: 5px; color: #333; font-weight: bold; }
        
        .footer { padding: 15px; background: #eee; text-align: center; border-top: 1px solid #ccc; }
        .submit-btn { background: #5cb85c; color: white; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold; }
        .submit-btn:hover { background: #4cae4c; }
        
        #result-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 500px; max-width: 90%; }
        .modal-content h2 { margin-top: 0; }
        .modal-content table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .modal-content th, .modal-content td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        .close-btn { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <span style="background: white; color: green; padding: 2px 10px; border-radius: 20px; margin-right: 10px;">✔</span>
            NATIONAL TESTING AGENCY
        </div>
        <div class="candidate-info">
            <div>
                <img src="/static/candidate_profile.png" alt="Candidate" style="width: 70px; height: 70px; border-radius: 4px; object-fit: cover; border: 1px solid #ddd;">
            </div>
            <div>
                <div>Candidate Name : ABHIK GUPTA</div>
                <div>Test : JEE Mains 2026 - {{ shift }}</div>
                <div>Remaining Time : <span class="timer" id="timer">03:00:00</span></div>
            </div>
        </div>
    </div>
    
    <div class="main-body">
        <div class="left-panel">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('Physics')">Physics</button>
                <button class="tab" onclick="switchTab('Chemistry')">Chemistry</button>
                <button class="tab" onclick="switchTab('Mathematics')">Mathematics</button>
            </div>
            <iframe id="pdf-Physics" class="pdf-view active" src="/static/papers/{{ shift }}/{{ phys_pdf }}#toolbar=0&view=FitH"></iframe>
            <iframe id="pdf-Chemistry" class="pdf-view" src="/static/papers/{{ shift }}/{{ chem_pdf }}#toolbar=0&view=FitH"></iframe>
            <iframe id="pdf-Mathematics" class="pdf-view" src="/static/papers/{{ shift }}/{{ math_pdf }}#toolbar=0&view=FitH"></iframe>
        </div>
        
        <div class="right-panel">
            <div class="omr-header" id="omr-header-title">
                Physics Answer Sheet
            </div>
            
            <form id="test-form" class="omr-content">
                <script>
                    const locations = {{ locations | tojson }};
                    const subjects = ['Physics', 'Chemistry', 'Mathematics'];
                    
                    const startQNums = {
                        'Mathematics': 1,
                        'Physics': 26,
                        'Chemistry': 51
                    };
                    
                    document.write(subjects.map(sub => {
                        const start_q = startQNums[sub];
                        return `
                        <div id="omr-${sub}" class="subject-omr ${sub === 'Physics' ? 'active' : ''}">
                            <div class="section-title">Section A (MCQ)</div>
                            ${Array.from({length: 20}, (_, i) => i).map(i => {
                                const realQ = start_q + i;
                                return `
                                <div class="q-row" onclick="jumpToQuestion('${sub}', ${realQ})">
                                    <div class="q-num">Q${realQ}.</div>
                                    <div class="q-options" onclick="event.stopPropagation()">
                                        <label><input type="radio" name="${sub}_mcq_${i+1}" value="1"> 1</label>
                                        <label><input type="radio" name="${sub}_mcq_${i+1}" value="2"> 2</label>
                                        <label><input type="radio" name="${sub}_mcq_${i+1}" value="3"> 3</label>
                                        <label><input type="radio" name="${sub}_mcq_${i+1}" value="4"> 4</label>
                                        <button type="button" onclick="document.querySelectorAll(&quot;input[name='${sub}_mcq_${i+1}']&quot;).forEach(r => r.checked=false); return false;" style="font-size:11px; padding:2px 5px; cursor:pointer;">Clear</button>
                                    </div>
                                </div>
                                `;
                            }).join('')}
                            
                            <div class="section-title">Section B (Numeric)</div>
                            <p style="font-size: 12px; color: #666; margin-top:0;">Attempt all 5 numerical questions.</p>
                            ${Array.from({length: 5}, (_, i) => i + 20).map(i => {
                                const realQ = start_q + i;
                                return `
                                <div class="q-row" onclick="jumpToQuestion('${sub}', ${realQ})">
                                    <div class="q-num">Q${realQ}.</div>
                                    <div onclick="event.stopPropagation()"><input type="number" step="any" name="${sub}_num_${i-19}" class="num-input"></div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                        `;
                    }).join(''));
                </script>
            </form>
            
            <div class="footer">
                <button type="button" class="submit-btn" onclick="submitTest()">Submit Test</button>
            </div>
        </div>
    </div>
    
    <div id="result-modal">
        <div class="modal-content">
            <h2>Test Results</h2>
            <table>
                <tr>
                    <th>Subject</th>
                    <th>Score</th>
                    <th>Correct</th>
                    <th>Incorrect</th>
                </tr>
                <tr id="res-Physics"></tr>
                <tr id="res-Chemistry"></tr>
                <tr id="res-Mathematics"></tr>
                <tr>
                    <th>Total</th>
                    <th id="res-total" colspan="3"></th>
                </tr>
            </table>
            <h3 style="text-align:center; color:#007bff;">Expected Percentile: <span id="res-percentile"></span></h3>
            
            <div id="mistakes-container" style="display:none; max-height:200px; overflow-y:auto; margin-bottom:20px; border: 1px solid #ccc; padding: 10px; border-radius: 4px;">
                <h4 style="margin-top:0; color:#d9534f;">Mistakes Summary</h4>
                <ul id="mistakes-list" style="margin:0; padding-left:20px; font-size:14px; color:#333;"></ul>
            </div>
            
            <h4 style="margin-top:0; margin-bottom:10px; color:#333;">View Original Answer Keys (Full PDF):</h4>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="close-btn" style="background:#17a2b8; padding:8px 12px; font-size:13px;" onclick="window.open('/answer_key/{{ shift }}/Physics', '_blank')">Physics</button>
                <button class="close-btn" style="background:#17a2b8; padding:8px 12px; font-size:13px;" onclick="window.open('/answer_key/{{ shift }}/Chemistry', '_blank')">Chemistry</button>
                <button class="close-btn" style="background:#17a2b8; padding:8px 12px; font-size:13px;" onclick="window.open('/answer_key/{{ shift }}/Mathematics', '_blank')">Mathematics</button>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="close-btn" style="background:#5cb85c;" onclick="downloadResultPDF()">Download Score PDF</button>
                <button class="close-btn" onclick="window.location.href='/'">Go Home</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(subject) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.pdf-view').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.subject-omr').forEach(o => o.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('pdf-' + subject).classList.add('active');
            document.getElementById('omr-' + subject).classList.add('active');
            document.getElementById('omr-header-title').textContent = subject + ' Answer Sheet';
        }
        
        function jumpToQuestion(sub, realQ) {
            let targetQ = realQ;
            let loc = locations[sub][targetQ];
            
            // If exact question is not in locations (e.g. OCR miss), find the closest previous question
            if (!loc) {
                for (let q = realQ - 1; q >= 1; q--) {
                    if (locations[sub][q]) {
                        loc = locations[sub][q];
                        break;
                    }
                }
            }
            
            if(loc) {
                const iframe = document.getElementById('pdf-' + sub);
                let baseSrc = iframe.src.split('#')[0];
                iframe.src = baseSrc + "#page=" + loc.page;
            }
        }
        
        // removed max 5 numericals enforcement since there are only 5 inputs now
        
        // Timer
        let timeInSeconds = 3 * 60 * 60; // 3 hours
        const timerSpan = document.getElementById('timer');
        
        const timerInterval = setInterval(() => {
            timeInSeconds--;
            if(timeInSeconds <= 0) {
                clearInterval(timerInterval);
                submitTest();
            } else {
                let h = Math.floor(timeInSeconds / 3600);
                let m = Math.floor((timeInSeconds % 3600) / 60);
                let s = timeInSeconds % 60;
                timerSpan.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
        }, 1000);
        
        function submitTest() {
            clearInterval(timerInterval);
            
            const payload = {
                shift: "{{ shift }}",
                answers: {
                    'Physics': { 'mcq': {}, 'num': {} },
                    'Chemistry': { 'mcq': {}, 'num': {} },
                    'Mathematics': { 'mcq': {}, 'num': {} }
                }
            };
            
            const formData = new FormData(document.getElementById('test-form'));
            for(let [name, val] of formData.entries()) {
                if(!val) continue;
                const parts = name.split('_');
                const sub = parts[0];
                const type = parts[1];
                const qNum = parts[2];
                payload.answers[sub][type][qNum] = val;
            }
            
            fetch('/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(data => {
                last_result_data = data;
                document.getElementById('result-modal').style.display = 'flex';
                
                ['Physics', 'Chemistry', 'Mathematics'].forEach(sub => {
                    const res = data.results[sub];
                    document.getElementById('res-' + sub).innerHTML = `
                        <td>${sub}</td>
                        <td>${res.score}</td>
                        <td>${res.correct}</td>
                        <td>${res.incorrect}</td>
                    `;
                });
                
                document.getElementById('res-total').textContent = data.total_score + " / 300";
                document.getElementById('res-percentile').textContent = data.percentile.toFixed(2) + " %ile";
                
                if(data.mistakes && data.mistakes.length > 0) {
                    const mList = document.getElementById('mistakes-list');
                    mList.innerHTML = '';
                    data.mistakes.forEach(m => {
                        mList.innerHTML += `<li><b>${m.subject} ${m.q_num}</b>: You answered <span style="color:red">${m.user_ans}</span> (Correct: <span style="color:green">${m.correct_ans}</span>)</li>`;
                    });
                    document.getElementById('mistakes-container').style.display = 'block';
                }
            });
        }
        
        let last_result_data = null;
        
        function downloadResultPDF() {
            if(!last_result_data) return;
            
            fetch('/download_result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(last_result_data)
            })
            .then(res => res.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'JEE_Mock_Result.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
